name: Обновление статистики

# Один запуск работает ~5 ч 40 мин и собирает данные каждые 5 минут
# (scripts/loop.py). Расписание раз в час нужно, чтобы следующий запуск
# встал в очередь и продолжил сбор сразу после окончания текущего.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - name: Собирать данные каждые 5 минут
        env:
          COC_TOKEN: ${{ secrets.COC_TOKEN }}
          CLAN_TAG: ${{ vars.CLAN_TAG || '#280L809U9' }}
          INTERVAL: "300"
        run: |
          git config user.name "clan-stats-bot"
          git config user.email "clan-stats-bot@users.noreply.github.com"
          python3 scripts/loop.py
