name: Обновление статистики

on:
  schedule:
    # GitHub часто пропускает запуски в «круглые» минуты, поэтому время смещено
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:          # кнопка «Run workflow» для ручного запуска

permissions:
  contents: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Собрать данные из API Clash of Clans
        env:
          COC_TOKEN: ${{ secrets.COC_TOKEN }}
          CLAN_TAG: ${{ vars.CLAN_TAG || '#280L809U9' }}
        run: python3 scripts/collect.py

      - name: Сохранить изменения
        run: |
          git config user.name "clan-stats-bot"
          git config user.email "clan-stats-bot@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then
            echo "Изменений нет"
            exit 0
          fi
          git commit -m "Обновление данных $(date -u +'%Y-%m-%d %H:%M') UTC"
          git pull --rebase --quiet
          git push
